name: Update profile stars

on:
  schedule:
    # Daily at 00:23 UTC, away from the busiest start-of-hour period.
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - README.md
      - scripts/update_stars.py
      - tests/test_update_stars.py
      - .github/workflows/update-stars.yml

permissions:
  contents: write

concurrency:
  group: profile-stars
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'yuxino/yuxino'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test the updater
        run: python3 -m unittest discover -s tests -v

      - name: Refresh star counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stars.py

      - name: Commit changed counts and refresh date
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "The profile is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update profile stars"
          git push
