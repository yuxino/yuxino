name: Update profile stars

on:
  schedule:
    # Daily at midnight Beijing time. GitHub may delay scheduled runs.
    - cron: '0 0 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'profile/*.md'
      - 'profile/projects.json'
      - 'scripts/*.py'
      - 'tests/*.py'
      - '.github/workflows/update-stars.yml'

permissions:
  contents: write

concurrency:
  group: profile-stars
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'yuxino/yuxino'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test sorting, layout and failure safety
        run: python3 -m unittest discover -s tests -v

      - name: Refresh stars and render the sorted profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stars.py

      - name: Commit the profile and both color themes together
        run: |
          git add README.md profile/stars.json assets/profile/minimal/
          if git diff --cached --quiet; then
            echo "The profile is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: refresh stars and sort profile projects"
          git push
